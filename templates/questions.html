 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Questions</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .questions{
            font-size: 1.25rem;
        }
        .quiz-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .progress-bar-container {
            margin-bottom: 20px;
        }

        .question-box {
            margin-bottom: 30px;
        }

        .feedback {
            font-weight: bold;
            margin-top: 10px;
        }

        .feedback.correct {
            color: #28a745;
        }

        .feedback.wrong {
            color: #dc3545;
        }

        .btn-submit {
            margin-top: 20px;
        }

        .results {
            text-align: center;
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .score {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .option {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px; /* Increased gap between options for better spacing */
        }

        label {
            background-color: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        label:hover {
            background-color: #e9ecef;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + label {
            background-color: #cfe2ff;
            border-color: #0d6efd;
        }

    </style>
</head>
<body>
    <div class="quiz-container" id="quiz">
        <h1>{{ user_input }}</h1>
        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress">
                <div class="progress-bar" id="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
        </div>

        <form id="quiz-form">
            <div id="question-container">
                {% for question in questions %}
                <div class="question-box" id="question_{{ loop.index }}" style="display: none;">
                    <div class="option">
                        <p class="questions"><strong>{{ loop.index }}. {{ question.split('<br>')[0] }}</strong></p>
                        {% set idx = loop.index %}
                        {% for option in question.split('<br>')[1:5] %}
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="question_{{ idx }}" value="{{ option.strip() }}" id="q{{ idx }}_{{ loop.index }}">
                                <label class="form-check-label" for="q{{ idx }}_{{ loop.index }}">
                                    {{ option }}
                                </label>
                            </div>
                        {% endfor %}
                        <p class="feedback" id="feedback_{{ idx }}"></p>
                    </div>
                </div>
                {% endfor %}
            </div>
            <button type="button" class="btn btn-primary" id="next-btn" style="display: none;">Next</button>
            <button type="button" class="btn btn-success btn-submit" id="submit-btn" style="display: none;">Submit</button>
        </form>
    </div>

    <script>
        const correctAnswers = {{ correct_answers | tojson }};
        const feedbackElements = document.querySelectorAll('.feedback');
        const questionBoxes = document.querySelectorAll('.question-box');
        const nextButton = document.getElementById('next-btn');
        const submitButton = document.getElementById('submit-btn');
        const quizContainer = document.getElementById('quiz');
        const progressBar = document.getElementById('progress-bar');

        let currentQuestionIndex = 0;
        let score = 0;

        function showQuestion(index) {
            questionBoxes.forEach((box, i) => {
                box.style.display = i === index ? 'block' : 'none';
            });

            // Update progress bar
            const progressPercentage = ((index + 1) / questionBoxes.length) * 100;
            progressBar.style.width = `${progressPercentage}%`;
            progressBar.setAttribute('aria-valuenow', progressPercentage);

            if (index === questionBoxes.length - 1) {
                nextButton.style.display = 'none';
                submitButton.style.display = 'block';
            } else {
                nextButton.style.display = 'block';
                submitButton.style.display = 'none';
            }
        }

        function checkCurrentAnswer() {
            const currentFeedback = feedbackElements[currentQuestionIndex];
            const selectedOption = document.querySelector(`input[name="question_${currentQuestionIndex + 1}"]:checked`);

            if (!selectedOption) {
                currentFeedback.textContent = "No option selected.";
                currentFeedback.className = "feedback wrong";
                return false;
            }

            const selectedValue = selectedOption.value.trim().toLowerCase();
            const correctAnswer = correctAnswers[currentQuestionIndex].trim().toLowerCase();

            if (selectedValue[0] === correctAnswer) {
                currentFeedback.textContent = "Correct!";
                currentFeedback.className = "feedback correct";
                score++;
            } else {
                currentFeedback.textContent = `Wrong! Correct Answer: ${correctAnswers[currentQuestionIndex].trim()}`;
                currentFeedback.className = "feedback wrong";
            }

            return true;
        }

        nextButton.addEventListener('click', () => {
            if (checkCurrentAnswer()) {
                currentQuestionIndex++;
                showQuestion(currentQuestionIndex);
            }
        });

        submitButton.addEventListener('click', () => {
            if (checkCurrentAnswer()) {
                showResults();
            }
        });

        function showResults() {
            quizContainer.innerHTML = `
                <div class="results">
                    <div class="result-icon">
                        <i class="fas ${score > correctAnswers.length / 2 ? 'fa-trophy text-success' : 'fa-times-circle text-danger'}"></i>
                    </div>
                    <div class="score">Your score: ${score} / ${correctAnswers.length}</div>
                    <p>${score > correctAnswers.length / 2 ? 'Great job!' : 'Better luck next time!'}</p>
                    <button class="btn btn-primary" onclick="location.reload()">Restart Quiz</button>
                </div>
            `;
        }

        showQuestion(currentQuestionIndex);
    </script>
</body>
</html>
